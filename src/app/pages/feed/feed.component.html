<header class="feed-header">
  <img 
  src="https://1000logos.net/wp-content/uploads/2017/02/Logo-Instagram.png" 
  alt="Instagram Logo" 
  class="logo"
/>
  <button class="logout-btn" (click)="logout()">Sair</button>
</header>

<div class="feed">
  <div *ngFor="let post of posts" class="post">
    <div class="post-header">
      <img class="avatar" src="https://i.pravatar.cc/40" alt="Avatar do usuário">
      <span class="username">{{ post.user }}</span>
    </div>

    <img [src]="post.image" class="post-image" alt="Imagem do post">

    <div class="post-actions">
      <span 
        class="like-icon"
        [class.liked]="post.liked"
        (click)="toggleLike(post)"
      >&#10084;</span>
      <span class="likes">{{ post.likes }} curtidas</span>
    </div>

    <div class="post-description">
      <strong>{{ post.user }}</strong> {{ post.description }}
    </div>
  </div>
</div>
