<header class="navbar">
  <div class="navbar-left">
    <img
      src="https://1000logos.net/wp-content/uploads/2017/02/Logo-Instagram.png"
      alt="Instagram Logo"
      class="logo"
    />
  </div>

  <div class="navbar-center">
    <input type="text" placeholder="Pesquisar" class="search-bar" />
  </div>

  <div class="navbar-right">
    <button class="logout-btn" (click)="logout()">Sair</button>
    <button class="dark-mode-toggle" (click)="toggleDarkMode()">🌙 / ☀️</button>
  </div>
</header>

<div class="stories-container">
  <div *ngFor="let story of stories" class="story">
    <img [src]="story.avatar" [alt]="story.user" />
    <span>{{ story.user }}</span>
  </div>
</div>

<div class="feed">
  <div *ngFor="let post of posts" class="post">
    <div class="post-header">
      <img class="avatar" [src]="post.avatar" [alt]="post.user" />
      <span class="username">{{ post.user }}</span>
    </div>

    <img [src]="post.image" class="post-image" [alt]="post.description" />

    <div class="post-actions">
      <i
        class="fa-heart fa-solid like-icon"
        [class.liked]="post.liked"
        (click)="toggleLike(post)"
      ></i>
      <i class="fa-regular fa-comment"></i>
      <i class="fa-regular fa-paper-plane"></i>
      <i class="fa-regular fa-bookmark save-icon"></i>
    </div>

    <div class="post-comments">
      <div *ngFor="let comment of post.comments" class="comment">
        <span class="comment-username">{{ comment.username }}:</span> {{ comment.text }}
      </div>

      <div class="add-comment">
        <input #commentInput type="text" placeholder="Adicionar um comentário..." />
        <button (click)="addComment(post, commentInput)">Postar</button>
      </div>
    </div>
  </div>
</div>
