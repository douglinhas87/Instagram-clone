<div class="profile-container">
  <div class="profile-header">
    <img class="profile-picture" src="https://via.placeholder.com/150" alt="Profile Picture">
    
    <div class="profile-info">
      <div class="top-row">
        <h2 class="username">{{ username }}</h2>
        <button class="edit-button">Seguir</button>
      </div>
      <div class="stats-row">
        <span><strong>12</strong> publicações</span>
        <span><strong>340</strong> seguidores</span>
        <span><strong>180</strong> seguindo</span>
      </div>
      <div class="bio-row">
        <strong>Douglas Ferraz</strong>
        <p>Dev e estudante na UFRPE 🚀</p>
      </div>
    </div>
  </div>

  <div class="posts-grid">
    <img src="https://via.placeholder.com/300" alt="Post 1">
    <img src="https://via.placeholder.com/300" alt="Post 2">
    <img src="https://via.placeholder.com/300" alt="Post 3">
    <img src="https://via.placeholder.com/300" alt="Post 4">
    <img src="https://via.placeholder.com/300" alt="Post 5">
    <img src="https://via.placeholder.com/300" alt="Post 6">
  </div>
</div>
