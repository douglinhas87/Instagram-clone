<div class="profile-container">
  <div class="profile-header">
    <img [src]="posts[0].avatar" alt="Avatar" class="avatar" />
    <div class="profile-info">
      <h2>{{ username }}</h2>
      <p>{{ posts.length }} posts</p>
    </div>
    <button (click)="toggleFollow()" class="follow-btn">
      {{ isFollowing ? 'Seguindo' : 'Seguir' }}
    </button>
  </div>

  <div class="post-grid">
    <div *ngFor="let post of posts" class="post-item">
      <img [src]="post.image" alt="Post" />
    </div>
  </div>

  <div *ngIf="posts.length === 0" class="no-posts">
    <p>Esse usuário ainda não postou nada 🤷‍♂️</p>
  </div>
</div>
