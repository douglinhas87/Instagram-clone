<div class="suggestions-container">
  <div class="profile">
    <img src="assets/avatars/leticia.jpg" class="profile-pic mr-3" />
    <div class="text-info">
      <p class="username">leticiarebeka_</p>
      <p class="name">Leticia Rebeka</p>
    </div>
    <button class="see-all-btn">Mudar</button>
  </div>

  <div class="suggestions-header">
    <p class="section-header">Sugestões para você</p>
    <button class="see-all-btn">Ver tudo</button>
  </div>

  <!-- Lista de sugestões -->
  <div *ngFor="let suggestion of suggestions" class="suggestion-item">
    <div class="profile-info">
      <img [src]="suggestion.profileImage" class="profile-pic mr-3" />
      <div class="text-info">
        <p class="username">{{ suggestion.username }}</p>
        <p class="name">{{ suggestion.name }}</p>
      </div>
    </div>

    <!-- Botão com toggle -->
    <button 
      [ngClass]="{'following': suggestion.isFollowing}" 
      (click)="toggleFollow(suggestion)">
      {{ suggestion.isFollowing ? 'Seguindo' : 'Seguir' }}
    </button>
  </div>

  <div class="footer">
    <p>
      Sobre • Ajuda • Imprensa • API • Carreiras • Privacidade • Termos • Localizações •
      Idioma • Meta Verified
    </p>
    <p class="copyright">© 2025 CLONE INSTAGRAM FROM DOUGLINHAS</p>
  </div>
</div>
